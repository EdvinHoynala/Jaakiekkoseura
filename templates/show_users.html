<!DOCTYPE html>
<html>

<head>
  <title>Käyttäjä {{ user.username }}</title>
</head>
<body>
  <h1>Käyttäjä {{ user.username }}</h1>
  <p>
    Käyttäjällä on yhteensä {{ announcements | count }} vuoroilmoitusta.
  </p>
  <h2>Ilmoitukset</h2>
  <ul>
    {% for announcement in announcements %}
      <li><a href="/page/{{ announcement.id }}">{{ announcement.title }}</a></li>
    {% endfor %}
  </ul>
  <p>
    <a href="/">Takaisin</a>
  </p>
</body>

</html>
